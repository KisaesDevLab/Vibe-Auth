name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  PNPM_VERSION: 9.15.9

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run typecheck
      - run: pnpm -r run build
      - run: pnpm -r run test
      - name: Validate deploy compose
        run: docker compose -f deploy/compose.yml --env-file deploy/.env.example config -q

  integration:
    # Real Authentik + Postgres + broker + ref-app (Phase 1/5 exit gates).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm -r run build
      - name: Bring up the test stack
        run: |
          cp test/.env.example test/.env
          docker compose -f test/compose.yml up -d --build
      - name: Wait for broker health
        run: test/scripts/wait-for.sh http://localhost:8080/vibe-auth/health 300
      - name: Run the integration matrix
        run: node test/scripts/integration.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose -f test/compose.yml logs --tail=200
      - run: docker compose -f test/compose.yml down -v
        if: always()

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, registry-url: https://npm.pkg.github.com, scope: "@kisaes" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kisaes/vibe-auth run build
      - name: Set version from tag
        run: cd packages/client && npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - run: cd packages/client && pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vibe-auth
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/broker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
